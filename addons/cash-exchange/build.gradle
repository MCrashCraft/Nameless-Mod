plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}
version = '0.1.0'
group = 'dev.mcrashcraft'
base { archivesName = 'namelessmc-cash-exchange-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
}
repositories { mavenCentral() }
configurations { shade; implementation.extendsFrom shade }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.16'
    compileOnly 'net.luckperms:api:5.5'
    shade 'org.spongepowered:configurate-yaml:4.2.0'
    shade 'com.google.code.gson:gson:2.14.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-proc:none']
}
tasks.register('gatherDependencyLicenses') {
    inputs.files configurations.shade
    outputs.dir layout.buildDirectory.dir('generated/dependency-licenses')
    doLast {
        def root = layout.buildDirectory.dir('generated/dependency-licenses').get().asFile
        configurations.shade.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            copy {
                from zipTree(artifact.file)
                include '**/LICENSE*', '**/license*', '**/NOTICE*', '**/notice*', '**/COPYING*'
                includeEmptyDirs = false
                into new File(root, artifact.moduleVersion.id.group + '.' + artifact.name + '-' + artifact.moduleVersion.id.version)
            }
        }
    }
}
processResources {
    dependsOn 'gatherDependencyLicenses'
    filesMatching('META-INF/mods.toml') { expand 'version': project.version }
    from('LICENSE') { into 'META-INF/licenses/namelessmc-cash-exchange' }
    from('UPSTREAM-NOTICE.md') { into 'META-INF' }
    from(layout.buildDirectory.dir('generated/dependency-licenses')) { into 'META-INF/licenses/dependencies' }
    from('third-party-licenses') { into 'META-INF/licenses/dependencies' }
}
jar { archiveClassifier = 'slim' }
shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.shade]
    mergeServiceFiles()
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class', 'META-INF/versions/**/module-info.class'
    relocate 'org.spongepowered.configurate', 'dev.mcrashcraft.namelessexchange.lib.configurate'
    relocate 'org.yaml.snakeyaml', 'dev.mcrashcraft.namelessexchange.lib.snakeyaml'
    relocate 'io.leangen.geantyref', 'dev.mcrashcraft.namelessexchange.lib.geantyref'
    relocate 'com.google.gson', 'dev.mcrashcraft.namelessexchange.lib.gson'
    relocate 'net.kyori', 'dev.mcrashcraft.namelessexchange.lib.kyori'
    relocate 'com.google.errorprone', 'dev.mcrashcraft.namelessexchange.lib.errorprone'
    relocate 'org.checkerframework', 'dev.mcrashcraft.namelessexchange.lib.checkerframework'
    relocate 'org.jspecify', 'dev.mcrashcraft.namelessexchange.lib.jspecify'
}
reobf { shadowJar {} }
tasks.named('build').configure { dependsOn 'reobfShadowJar' }
tasks.named('test').configure { useJUnitPlatform() }
tasks.register('sourceBundle', Zip) {
    archiveBaseName = 'namelessmc-cash-exchange-1.20.1'
    archiveClassifier = 'sources'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from('.') {
        include 'src/**', 'third-party-licenses/**', 'gradle/**', 'gradlew', 'gradlew.bat', '*.gradle', 'gradle.properties', 'LICENSE', '*.md'
        exclude '**/.git/**', '**/build/**', '**/.gradle/**'
    }
}
