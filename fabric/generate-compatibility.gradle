def numeric = { value -> value.tokenize('.').collect { it as int } }
def atLeast = { minimum ->
    def left = numeric(game); def right = numeric(minimum)
    int size = Math.max(left.size(), right.size())
    for (int i = 0; i < size; i++) {
        int a = i < left.size() ? left[i] : 0
        int b = i < right.size() ? right[i] : 0
        if (a != b) return a > b
    }
    true
}
