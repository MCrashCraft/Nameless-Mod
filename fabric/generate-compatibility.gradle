        @@CALLBACK@@
    }
    private static Object nativeJson(com.google.gson.JsonElement value, com.mojang.serialization.DynamicOps<Object> ops) {
        if (value == null || value.isJsonNull()) return ops.empty();
        if (value.isJsonArray()) return ops.createList(java.util.stream.StreamSupport.stream(value.getAsJsonArray().spliterator(), false)
                .map(child -> nativeJson(child, ops)));
        if (value.isJsonObject()) return ops.createMap(value.getAsJsonObject().entrySet().stream()
                .map(entry -> com.mojang.datafixers.util.Pair.of(ops.createString(entry.getKey()), nativeJson(entry.getValue(), ops))));
        var primitive = value.getAsJsonPrimitive();
        if (primitive.isBoolean()) return ops.createBoolean(primitive.getAsBoolean());
        if (primitive.isNumber()) return ops.createNumeric(primitive.getAsBigDecimal());
        return ops.createString(primitive.getAsString());
    }
    private MinecraftCompatibility() { }
}
