    public static int dataVersion() {
        try (var stream = MinecraftServer.class.getResourceAsStream("/version.json")) {
            if (stream == null) throw new IllegalStateException("Minecraft version metadata is missing");
            var json = com.google.gson.JsonParser.parseReader(new InputStreamReader(stream, StandardCharsets.UTF_8)).getAsJsonObject();
            return json.get("world_version").getAsInt();
        } catch (java.io.IOException | RuntimeException failure) {
            throw new IllegalStateException("Minecraft data version cannot be determined", failure);
        }
    }
