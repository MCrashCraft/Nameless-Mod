plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.148' apply false
    id 'com.gradleup.shadow' version '9.3.0'
}

def selectedGame = providers.gradleProperty('minecraftVersion').orElse('1.21.1').get()
apply plugin: selectedGame == '1.20.1' ? 'net.neoforged.moddev.legacyforge' : 'net.neoforged.moddev'
apply from: 'common.gradle'
