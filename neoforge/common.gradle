import groovy.json.JsonSlurper

def targetMinecraft = providers.gradleProperty('minecraftVersion').orElse('1.21.1').get()
def targets = new JsonSlurper().parse(file('../compatibility/targets.json'))
def target = targets.releases.find { it.minecraft == targetMinecraft }
if (target == null || !target.neoforge?.published) throw new GradleException("No published NeoForge target for ${targetMinecraft}")
def early = project.ext.has('earlyNeoGradle') && project.ext.earlyNeoGradle
def legacy = targetMinecraft == '1.20.1'
def plainJUnit = legacy || early || targetMinecraft == '1.20.4'
def legacyEvents = targetMinecraft.startsWith('1.20.') && targetMinecraft.tokenize('.').last().toInteger() <= 4
def neoVersion = target.neoforge.version
def javaVersion = target.java_major as int

version = '0.2.0'
group = 'dev.mcrashcraft'
base { archivesName = "namelessmc-neoforge-${targetMinecraft}" }
layout.buildDirectory = file("build/${targetMinecraft}")
java.toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
if (early) {
    dependencies { implementation "net.neoforged:neoforge:${neoVersion}" }
    runs {
        configureEach { modSource project.sourceSets.main }
        server { programArgument '--nogui' }
    }
} else if (legacy) {
    legacyForge {
        enable { neoForgeVersion = neoVersion }
        mods { namelessforge { sourceSet sourceSets.main } }
        runs { server { server() } }
    }
} else {
    neoForge {
        version = neoVersion
        mods { namelessforge { sourceSet sourceSets.main } }
        runs { server { server() } }
        if (!plainJUnit) {
            unitTest {
                enable()
                testedMod = mods.namelessforge
            }
        }
    }
}

repositories { mavenCentral() }
configurations { shade; implementation.extendsFrom shade }
configurations.shade.dependencies.all { dependency ->
    if (dependency instanceof org.gradle.api.artifacts.ModuleDependency) dependency.exclude group: 'org.slf4j'
}
// NeoForge pins vanilla's library versions strictly. The mod shades and relocates its
// own Gson/Guava copies, so their compilation inputs must resolve to those same copies.
configurations.matching { it.name in ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath'] }.configureEach {
    resolutionStrategy.force 'com.google.code.gson:gson:2.14.0',
            'com.google.guava:guava:33.4.8-jre', 'com.google.guava:failureaccess:1.0.3'
}
dependencies {
    compileOnly 'net.luckperms:api:5.5'
    compileOnly 'org.checkerframework:checker-qual:3.55.1'
    compileOnly 'org.slf4j:slf4j-api:2.0.1'
    shade 'net.kyori:adventure-api:4.26.1'
    shade 'net.kyori:adventure-text-minimessage:4.26.1'
    shade 'net.kyori:adventure-text-serializer-gson:4.26.1'
    shade 'net.kyori:adventure-text-serializer-plain:4.26.1'
    shade 'org.spongepowered:configurate-yaml:4.2.0'
    shade 'com.github.mizosoft.methanol:methanol:1.9.0'
    shade 'com.google.code.gson:gson:2.14.0'
    shade 'com.google.guava:guava:33.4.8-jre'
    shade 'org.bstats:bstats-base:3.2.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'net.luckperms:api:5.5'
    testImplementation 'org.slf4j:slf4j-api:2.0.1'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

sourceSets.main.java.srcDirs += [
    '../minecraft-adapter/src/main/java',
    '../forge/vendor/nameless-plugin/common/src/main',
    '../forge/vendor/nameless-java-api/src/main/java',
    '../forge/vendor/kyori-event/api/src/main/java',
    layout.buildDirectory.dir('generated/sources/upstream'),
    layout.buildDirectory.dir('generated/sources/native')
]
sourceSets.test.java.srcDirs = ['../forge/src/test/java']
// These distributions predate the native NeoForge JUnit launch profile.
if (plainJUnit) {
    sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
    sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
}
tasks.register('generateUpstreamConstants', Sync) {
    from '../forge/vendor/nameless-plugin/common/src/filtered'
    into layout.buildDirectory.dir('generated/sources/upstream')
    filter { line -> line.replace('${project.version}', '3.4.2-neoforge-' + project.version) }
}

ext.minecraftVersion = targetMinecraft
apply from: '../fabric/generate-compatibility.gradle'

tasks.register('generateNeoForgeSources') {
    inputs.dir 'src/main/templates'
    inputs.property 'minecraftVersion', targetMinecraft
    inputs.property 'neoForgeVersion', neoVersion
    outputs.dir layout.buildDirectory.dir('generated/sources/native')
    doLast {
        def replacements = [
            '@MINECRAFT_VERSION@': targetMinecraft,
            '@LOADER_VERSION@': neoVersion,
            '@FORGE_BUS_IMPORT@': legacy ? 'net.minecraftforge.common.MinecraftForge' : 'net.neoforged.neoforge.common.NeoForge',
            '@EVENT_BUS@': legacy ? 'MinecraftForge.EVENT_BUS' : 'NeoForge.EVENT_BUS',
            '@EVENT_PACKAGE@': legacy ? 'net.minecraftforge.event' : 'net.neoforged.neoforge.event',
            '@FML_PACKAGE@': legacy ? 'net.minecraftforge.fml' : 'net.neoforged.fml',
            '@TICK_IMPORT@': legacyEvents ? (legacy ? 'import net.minecraftforge.event.TickEvent;' : 'import net.neoforged.neoforge.event.TickEvent;') : 'import net.neoforged.neoforge.event.tick.ServerTickEvent;',
            '@TICK_TYPE@': legacyEvents ? 'TickEvent.ServerTickEvent' : 'ServerTickEvent.Post',
            '@TICK_GUARD@': legacyEvents ? 'if (event.phase != TickEvent.Phase.END || !loaded) return;' : 'if (!loaded) return;'
        ]
        ['NamelessNeoForgeMod', 'NeoForgeDataSender'].each { name ->
            def text = file("src/main/templates/${name}.java.txt").getText('UTF-8')
            replacements.each { key, value -> text = text.replace(key, value) }
            if (text.contains('@TICK_') || text.contains('@FML_')) throw new GradleException('Incomplete NeoForge template')
            def output = layout.buildDirectory.file("generated/sources/native/dev/mcrashcraft/namelessforge/${name}.java").get().asFile
            output.parentFile.mkdirs()
            output.setText(text, 'UTF-8')
        }
    }
}

tasks.register('generateNeoForgeMetadata') {
    inputs.property 'minecraftVersion', targetMinecraft
    inputs.property 'neoForgeVersion', neoVersion
    outputs.dir layout.buildDirectory.dir('generated/resources')
    doLast {
        def filename = legacyEvents ? 'mods.toml' : 'neoforge.mods.toml'
        def loaderRange = legacy ? '[47,)' : '[1,)'
        def loaderId = legacy ? 'forge' : 'neoforge'
        def loaderVersion = legacy ? neoVersion.substring(neoVersion.indexOf('-') + 1) : neoVersion
        def requiredField = legacyEvents ? 'mandatory=true' : 'type="required"'
        def text = """modLoader="javafml"
loaderVersion="${loaderRange}"
license="GPL-3.0-or-later"
[[mods]]
modId="namelessforge"
version="${project.version}"
displayName="NamelessMC NeoForge"
authors="MCrashCraft; NamelessMC contributors"
displayTest="IGNORE_ALL_VERSION"
description='''Unofficial server-only NamelessMC port. Configure the private API connection on your own server. No credentials are included.'''
[[dependencies.namelessforge]]
modId="${loaderId}"
${requiredField}
versionRange="[${loaderVersion},)"
ordering="NONE"
side="SERVER"
[[dependencies.namelessforge]]
modId="minecraft"
${requiredField}
versionRange="[${targetMinecraft}]"
ordering="NONE"
side="SERVER"
"""
        def output = layout.buildDirectory.file("generated/resources/META-INF/${filename}").get().asFile
        output.parentFile.mkdirs(); output.setText(text, 'UTF-8')
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += ['-proc:none'] }
tasks.named('compileJava').configure { dependsOn 'generateUpstreamConstants', 'generateNeoForgeSources', 'generateMinecraftCompatibility' }
processResources {
    dependsOn 'generateNeoForgeMetadata'
    from '../forge/vendor/nameless-plugin/common/resources'
    from(layout.buildDirectory.dir('generated/resources'))
    from('../forge/LICENSE') { into 'META-INF/licenses/nameless-plugin' }
    from('../forge/vendor/nameless-java-api/LICENSE') { into 'META-INF/licenses/nameless-java-api' }
    from('../forge/vendor/kyori-event/license.txt') { into 'META-INF/licenses/kyori-event' }
    from('../forge/UPSTREAM-NOTICE.md') { into 'META-INF' }
    from('../forge/third-party-licenses') { into 'META-INF/licenses/third-party' }
}
jar { archiveClassifier = 'slim' }
shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.shade]
    mergeServiceFiles()
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class', 'META-INF/versions/**/module-info.class'
    relocate 'com.namelessmc.java_api', 'dev.mcrashcraft.namelessforge.lib.api'
    relocate 'net.kyori', 'dev.mcrashcraft.namelessforge.lib.kyori'
    relocate 'org.spongepowered.configurate', 'dev.mcrashcraft.namelessforge.lib.configurate'
    relocate 'org.yaml.snakeyaml', 'dev.mcrashcraft.namelessforge.lib.snakeyaml'
    relocate 'io.leangen.geantyref', 'dev.mcrashcraft.namelessforge.lib.geantyref'
    relocate 'com.github.mizosoft.methanol', 'dev.mcrashcraft.namelessforge.lib.methanol'
    relocate 'com.google.gson', 'dev.mcrashcraft.namelessforge.lib.gson'
    relocate 'com.google.common', 'dev.mcrashcraft.namelessforge.lib.guava'
    relocate 'com.google.thirdparty', 'dev.mcrashcraft.namelessforge.lib.googlethirdparty'
    relocate 'com.google.errorprone', 'dev.mcrashcraft.namelessforge.lib.errorprone'
    relocate 'com.google.j2objc', 'dev.mcrashcraft.namelessforge.lib.j2objc'
    relocate 'org.reactivestreams', 'dev.mcrashcraft.namelessforge.lib.reactivestreams'
    relocate 'org.jetbrains.annotations', 'dev.mcrashcraft.namelessforge.lib.jetbrains'
    relocate 'org.checkerframework', 'dev.mcrashcraft.namelessforge.lib.checkerframework'
    relocate 'org.jspecify', 'dev.mcrashcraft.namelessforge.lib.jspecify'
    relocate 'javax.annotation', 'dev.mcrashcraft.namelessforge.lib.javaxannotation'
    relocate 'org.bstats', 'dev.mcrashcraft.namelessforge.lib.bstats'
}
if (legacy) {
    obfuscation { reobfuscate(tasks.named('shadowJar'), sourceSets.main) }
    tasks.named('build').configure { dependsOn 'reobfShadowJar' }
} else {
    tasks.named('build').configure { dependsOn 'shadowJar' }
}
tasks.named('test').configure {
    useJUnitPlatform()
    maxHeapSize = '1024m'
}

apply from: '../build-tools/source-bundle.gradle'
apply from: '../build-tools/adapter-tests.gradle'
