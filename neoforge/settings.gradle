pluginManagement {
    repositories { gradlePluginPortal(); maven { url = 'https://maven.neoforged.net/releases' } }
}
plugins { id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0' }
rootProject.name = 'namelessmc-neoforge'

def selectedGame = providers.gradleProperty('minecraftVersion').orElse('1.21.1').get()
if (selectedGame in ['1.20.2', '1.20.3', '1.20.5']) {
    rootProject.buildFileName = 'early-neoforge.gradle'
}
